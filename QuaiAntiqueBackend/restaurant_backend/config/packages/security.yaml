security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    
    # Rollenhierarchie ADMIN erbt von MITARBEITER, MITARBEITER erbt von BENUTZER
    role_hierarchy:
        ROLE_EMPLOYE: ROLE_USER
        ROLE_ADMIN: [ROLE_EMPLOYE, ROLE_USER]
    
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email
    
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            stateless: true
            provider: app_user_provider
            custom_authenticator: App\Security\ApiTokenAuthenticator

    access_control:
        
        - { path: ^/api/registration, roles: PUBLIC_ACCESS }
        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/doc, roles: PUBLIC_ACCESS }
        - { path: ^/api/admin/users, roles: ROLE_ADMIN }
        - { path: ^/api/admin/create-user, roles: ROLE_ADMIN }
        - { path: ^/api/admin/restaurant$, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/admin, roles: ROLE_EMPLOYE }
        - { path: ^/api/categories$, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/categories/\d+$, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/categories, roles: ROLE_EMPLOYE }
        - { path: ^/api/foods$, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/foods/\d+$, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/foods, roles: ROLE_EMPLOYE }
        - { path: ^/api/menus$, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/menus/\d+$, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/menus, roles: ROLE_EMPLOYE }
        - { path: ^/api/pictures$, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/pictures/\d+$, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/pictures, roles: ROLE_EMPLOYE }
        - { path: ^/api/stats/food/\d+/view$, roles: PUBLIC_ACCESS, methods: [POST] }
        - { path: ^/api/stats/menu/\d+/view$, roles: PUBLIC_ACCESS, methods: [POST] }
        - { path: ^/api/stats, roles: ROLE_ADMIN }
        - { path: ^/api/reservations/available, roles: PUBLIC_ACCESS }
        - { path: ^/api/reservations, roles: ROLE_USER }
        - { path: ^/api/account, roles: ROLE_USER }
        - { path: ^/api, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
