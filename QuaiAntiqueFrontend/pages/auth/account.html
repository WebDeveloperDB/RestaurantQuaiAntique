<div class="hero-scene text-center text-white">
    <div class="hero-scene-content">
        <h1>Mon compte</h1>
    </div>
</div>

<div class="container">
  
    <form id="infosForm">
        <div class="mb-3">
            <label for="NomInput" class="form-label">Nom</label>
            <input type="text" class="form-control" id="NomInput" name="Nom" placeholder="Votre nom">
        </div>

        <div class="mb-3">
            <label for="PrenomInput" class="form-label">Prénom</label>
            <input type="text" class="form-control" id="PrenomInput" name="Prenom" placeholder="Votre prénom">
        </div>

        <div class="mb-3">
            <label for="AllergieInput" class="form-label">Allergies</label>
            <input type="text" class="form-control" id="AllergieInput" name="Allergies" placeholder="Fruits de mer, arachides…">
        </div>

        <div class="mb-3">
            <label for="NbConvivesInput" class="form-label">Nombre de convives habituel</label>
            <input type="number" class="form-control" id="NbConvivesInput" name="NbConvives" placeholder="0">
        </div>

        <div class="text-center">
            <button type="button" id="btnSaveInfos" class="btn btn-primary">Modifier mes informations</button>
            <button type="button" id="btnDelete"    class="btn btn-danger">Supprimer mon compte</button>
        </div>
    </form>
</div>

<div class="hero-scene-content text-center mt-5">
    <h1>Changement de mot de passe</h1>
</div>

<div class="container">

    <form id="pwForm">
        <div class="mb-3">
            <label for="PasswordInput" class="form-label">Nouveau mot de passe</label>
            <input type="password" class="form-control" id="PasswordInput" name="Password">
        </div>

        <div class="mb-3">
            <label for="ValidatePasswordInput" class="form-label">Confirmez le mot de passe</label>
            <input type="password" class="form-control" id="ValidatePasswordInput" name="PasswordConfirm">
        </div>

        <div class="text-center">
            <button type="button" id="btnSavePw" class="btn btn-primary">Changer mon mot de passe</button>
        </div>
    </form>
</div>
