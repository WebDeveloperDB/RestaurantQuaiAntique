<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-10">
            <div class="card shadow" data-show="employe">
                <div class="card-header bg-primary text-white">
                    <h3 class="mb-0">Gestion des Plats</h3>
                </div>
                <div class="card-body">
                    <form id="foodForm">
                        <input type="hidden" id="foodId">
                        
                        <div class="mb-3">
                            <label for="foodTitle" class="form-label">Titre du plat *</label>
                            <input type="text" class="form-control" id="foodTitle" required>
                        </div>

                        <div class="mb-3">
                            <label for="foodDescription" class="form-label">Description *</label>
                            <textarea class="form-control" id="foodDescription" rows="3" required></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="foodPrice" class="form-label">Prix (en centimes) *</label>
                            <input type="number" class="form-control" id="foodPrice" min="0" required>
                            <small class="text-muted">Exemple: 1250 pour 12,50€</small>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Catégories</label>
                            <div id="categoriesCheckboxes" class="border rounded p-3">
                                
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="foodPicture" class="form-label">Photo (optionnel)</label>
                            <select class="form-select" id="foodPicture">
                                <option value="">Aucune photo</option>
                            </select>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-success" id="submitBtn">
                                <i class="bi bi-check-circle"></i> Ajouter
                            </button>
                            <button type="button" class="btn btn-secondary" id="cancelBtn" style="display: none;">
                                <i class="bi bi-x-circle"></i> Annuler
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="card shadow mt-4">
                <div class="card-header bg-dark text-white">
                    <h4 class="mb-0">Liste des Plats</h4>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Titre</th>
                                    <th>Description</th>
                                    <th>Prix</th>
                                    <th>Catégories</th>
                                    <th>Créé le</th>
                                    <th>Modifié le</th>
                                    <th data-show="employe,admin">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="foodsTableBody">
                               
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>


<div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-danger text-white">
                <h5 class="modal-title" id="deleteModalLabel">Confirmer la suppression</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                Êtes-vous sûr de vouloir supprimer ce plat ? Cette action est irréversible.
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
                <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Supprimer</button>
            </div>
        </div>
    </div>
</div>
