<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistiques - Quai Antique</title>
</head>
<body>
    <div class="hero-scene text-center text-white">
        <div class="hero-scene-content">
            <h1><i class="bi bi-graph-up"></i> Statistiques de Consultation</h1>
            <p class="lead">Analysez les plats et menus les plus populaires</p>
        </div>
    </div>

    <div class="container mt-5">
       
        <div id="alertContainer"></div>

       
        <div class="row mb-5">
            <div class="col-md-6">
                <div class="card text-white bg-primary">
                    <div class="card-body">
                        <h5 class="card-title"><i class="bi bi-eye-fill"></i> Vues totales - Plats</h5>
                        <h2 id="totalFoodViews" class="card-text">-</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card text-white bg-success">
                    <div class="card-body">
                        <h5 class="card-title"><i class="bi bi-eye-fill"></i> Vues totales - Menus</h5>
                        <h2 id="totalMenuViews" class="card-text">-</h2>
                    </div>
                </div>
            </div>
        </div>

     
        <div class="card mb-5 shadow">
            <div class="card-header bg-primary text-white">
                <h3 class="mb-0"><i class="bi bi-trophy-fill"></i> Top 10 des Plats les Plus Consultés</h3>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Plat</th>
                                <th>Consultations</th>
                                <th>Progression</th>
                            </tr>
                        </thead>
                        <tbody id="topFoodsTableBody">
                            <tr>
                                <td colspan="4" class="text-center">
                                    <div class="spinner-border text-primary" role="status">
                                        <span class="visually-hidden">Chargement...</span>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

       
        <div class="card mb-5 shadow">
            <div class="card-header bg-success text-white">
                <h3 class="mb-0"><i class="bi bi-trophy-fill"></i> Top 10 des Menus les Plus Consultés</h3>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Menu</th>
                                <th>Consultations</th>
                                <th>Progression</th>
                            </tr>
                        </thead>
                        <tbody id="topMenusTableBody">
                            <tr>
                                <td colspan="4" class="text-center">
                                    <div class="spinner-border text-success" role="status">
                                        <span class="visually-hidden">Chargement...</span>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

     
        <div class="text-center mb-5">
            <button class="btn btn-primary btn-lg" onclick="loadStats()">
                <i class="bi bi-arrow-clockwise"></i> Actualiser les statistiques
            </button>
        </div>
    </div>


</body>
</html>
