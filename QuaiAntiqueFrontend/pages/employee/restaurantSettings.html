<div class="container">
    <h1 class="text-center my-4">Paramètres du restaurant</h1>

   
    <form id="settingsForm" class="row g-3">

       
        <div class="col-md-4">
            <label for="MaxGuestInput" class="form-label">Nombre max. de convives</label>
            <input type="number" id="MaxGuestInput" class="form-control" min="1" required>
        </div>

       
        <div class="col-md-4">
            <label class="form-label">Service Midi (début & fin)</label>
            <div class="input-group">
                <input type="time" id="MidiStart" class="form-control" required>
                <span class="input-group-text">→</span>
                <input type="time" id="MidiEnd" class="form-control" required>
            </div>
        </div>

       
        <div class="col-md-4">
            <label class="form-label">Service Soir (début & fin)</label>
            <div class="input-group">
                <input type="time" id="SoirStart" class="form-control" required>
                <span class="input-group-text">→</span>
                <input type="time" id="SoirEnd" class="form-control" required>
            </div>
        </div>

     
        <div class="col-12 text-center pt-3">
            <button type="button" id="btnSaveSettings" class="btn btn-primary">
                Enregistrer
            </button>
        </div>
    </form>

    
    <div id="settingsMsg" class="text-center pt-3"></div>
</div>
