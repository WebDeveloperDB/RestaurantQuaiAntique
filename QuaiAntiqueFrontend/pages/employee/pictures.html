<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-10">
            <div class="card shadow" data-show="employe">
                <div class="card-header bg-primary text-white">
                    <h3 class="mb-0">Gestion de la Galerie</h3>
                </div>
                <div class="card-body">
                    <form id="pictureForm" enctype="multipart/form-data">
                        <input type="hidden" id="pictureId">
                        
                        <div class="mb-3">
                            <label for="pictureTitle" class="form-label">Titre de la photo *</label>
                            <input type="text" class="form-control" id="pictureTitle" required>
                            <small class="text-muted">Ce titre sera visible au survol de l'image</small>
                        </div>

                        <div class="mb-3" id="fileInputContainer">
                            <label for="pictureFile" class="form-label">Fichier image *</label>
                            <input type="file" class="form-control" id="pictureFile" accept="image/jpeg,image/jpg,image/png,image/gif,image/webp" required>
                            <small class="text-muted">Formats acceptés: JPG, PNG, GIF, WEBP (max 5MB)</small>
                        </div>

                        <div class="mb-3" id="currentImageContainer" style="display: none;">
                            <label class="form-label">Image actuelle</label>
                            <div>
                                <img id="currentImage" src="" alt="" style="max-width: 200px; max-height: 200px;" class="img-thumbnail">
                            </div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-success" id="submitBtn">
                                <i class="bi bi-upload"></i> Ajouter la photo
                            </button>
                            <button type="button" class="btn btn-secondary" id="cancelBtn" style="display: none;">
                                <i class="bi bi-x-circle"></i> Annuler
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="card shadow mt-4">
                <div class="card-header bg-dark text-white">
                    <h4 class="mb-0">Photos de la Galerie</h4>
                </div>
                <div class="card-body">
                    <div class="row" id="picturesGallery">
                       
                    </div>
                    <div id="noPicturesMessage" class="text-center text-muted" style="display: none;">
                        <p>Aucune photo dans la galerie pour le moment.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>



<div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-danger text-white">
                <h5 class="modal-title" id="deleteModalLabel">Confirmer la suppression</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                Êtes-vous sûr de vouloir supprimer cette photo ? Cette action est irréversible.
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
                <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Supprimer</button>
            </div>
        </div>
    </div>
</div>
